<nav class="navbar navbar-expand-lg fixed-top transition-all" [ngClass]="{'navbar-scrolled': isScrolled}">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="#" (click)="scrollTo('home', $event)">
      <span class="brand-accent">&lt;</span>
      Shamina
      <span class="brand-accent">/&gt;</span>
    </a>
    
    <div class="d-flex align-items-center gap-2 d-lg-none ms-auto me-2">
      <!-- Theme toggle button for mobile -->
      <button 
        class="theme-toggle-btn" 
        (click)="toggleTheme()" 
        [attr.aria-label]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
        <i class="bi" [ngClass]="isDarkMode ? 'bi-sun-fill' : 'bi-moon-stars-fill'"></i>
      </button>
    </div>

    <button
      class="navbar-toggler collapsed"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNav"
      aria-controls="mainNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="toggler-icon top-bar"></span>
      <span class="toggler-icon middle-bar"></span>
      <span class="toggler-icon bottom-bar"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeSection === 'home'" routerLink="/" fragment="home" (click)="scrollTo('home', $event)">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeSection === 'skills'" routerLink="/" fragment="skills" (click)="scrollTo('skills', $event)">About & Skills</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeSection === 'services'" routerLink="/free-services">Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeSection === 'projects'" routerLink="/" fragment="projects" (click)="scrollTo('projects', $event)">Projects</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeSection === 'resume'" routerLink="/" fragment="resume" (click)="scrollTo('resume', $event)">Resume</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeSection === 'contact'" routerLink="/" fragment="contact" (click)="scrollTo('contact', $event)">Contact</a>
        </li>
      </ul>
      <div class="ms-lg-3 d-none d-lg-flex align-items-center gap-3">
        <!-- Desktop Theme Toggle Switch -->
        <button 
          class="theme-toggle-btn" 
          (click)="toggleTheme()" 
          [attr.aria-label]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
          [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
          <i class="bi" [ngClass]="isDarkMode ? 'bi-sun-fill' : 'bi-moon-stars-fill'"></i>
        </button>

        <a routerLink="/" fragment="contact" (click)="scrollTo('contact', $event)" class="btn btn-neon py-2 px-4 btn-sm">Hire Me</a>
      </div>
    </div>
  </div>
</nav>
